# the mamba environment used for scripts which are not run by snakemake
name: non-snakemake-scripts
channels:
  - bioconda
  - conda-forge
  - defaults
  - pytorch
dependencies:
  - python=3.11
  - numpy==2.0.1
  - pandas==2.3.1
  - cmake
  - pybind11
  - nmslib
  - conda-forge::rapidfuzz==3.5.2
  - matplotlib==3.10.0
  - networkx==3.4.2
  - pip
  - pip:
      - scispacy==0.5.4
      - medspacy_quickumls==3.2
      - https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl # required base model
      - https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_md-0.5.4.tar.gz # model for general nlp sentence analysis
